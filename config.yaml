exchange:
  id: binance
  market_type: future
  rate_limit_ms: 250

symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - BNB/USDT
  - XRP/USDT
  - ADA/USDT
  - DOGE/USDT

btc_symbol: BTC/USDT

btc_macro_filter:
  enabled: true
  htf_timeframe: "4h"
  strong_threshold: 70
  bullish:
    buy_multiplier: 1.15
    sell_multiplier: 0.70
  bearish:
    buy_multiplier: 0.50
    sell_multiplier: 1.15

adaptive_target:
  atr_multiplier: 1.4

paper_trading:
  enabled: true
  starting_balance: 1000
  risk_pct_per_trade: 1.0
  # Round-trip taker fee + an estimated round-trip slippage allowance,
  # both as a fraction of price. Combined into one "cost" deducted from
  # every trade's pnl_pct. Slippage has no real execution to measure (this
  # is paper trading), so this is an estimate, not an observed number.
  fee_pct_roundtrip: 0.0008
  slippage_pct_roundtrip: 0.0006

# General position-sizing safety net. This does NOT fix fee-drag ratio
# (that's purely a function of cost% vs stop%, independent of position
# size or leverage — see min_net_rr below for the actual fee-aware
# check) — it's a separate hard cap on dollar exposure per trade, as a
# backstop against an unexpectedly tiny stop distance (bug, bad data,
# extreme low-volatility reading) producing an oversized position.
risk_management:
  max_leverage: 5
  # Minimum acceptable reward:risk AFTER deducting fee+slippage from both
  # sides, checked before a signal is even recorded. If costs eat too much
  # of the edge at the current stop distance, the trade is skipped rather
  # than taken at a worse-than-intended ratio.
  min_net_rr: 1.2

modes:
  scalp:
    primary_timeframe: "5m"
    confirm_timeframes: ["15m", "1h"]
    min_score_to_signal:
      buy: 73
      sell: 65
    min_score_gap: 10
    evaluation_candles: 12
    success_move_pct: 0.002
    rr: 1.5
    atr_period: 14
    # Raised from 0.0015 to 0.003: at 0.0015 the fee+slippage (0.0014
    # combined) ate ~93% of the designed risk on a stop-out. At 0.003 it's
    # ~47% — still meaningful but no longer reversing the intended R:R.
    min_stop_pct: 0.003
    cooldown_minutes: 20
    max_concurrent_positions: 3
    trailing:
      enabled: true
      trail_distance_pct: 0.3
    weights:
      technical: 20
      multi_timeframe: 15
      orderbook: 35
      market_structure: 5
      smc: 25
    smc_weight_cap_if_htf_disagrees: 15

  day:
    primary_timeframe: "15m"
    confirm_timeframes: ["1h", "4h"]
    min_score_to_signal: 68
    min_score_gap: 12
    evaluation_candles: 20
    success_move_pct: 0.01
    rr: 1.67
    atr_period: 20
    min_stop_pct: 0.006
    cooldown_minutes: 90
    max_concurrent_positions: 3
    trailing:
      enabled: true
      trail_distance_pct: 0.3
    weights:
      technical: 35
      multi_timeframe: 25
      orderbook: 15
      market_structure: 15
      smc: 10

  swing:
    primary_timeframe: "4h"
    confirm_timeframes: ["1d"]
    min_score_to_signal: 70
    min_score_gap: 15
    evaluation_candles: 30
    success_move_pct: 0.03
    rr: 1.67
    atr_period: 20
    min_stop_pct: 0.015
    cooldown_minutes: 360
    max_concurrent_positions: 2
    trailing:
      enabled: true
      trail_distance_pct: 0.3
    weights:
      technical: 25
      multi_timeframe: 35
      orderbook: 5
      market_structure: 25
      smc: 10

active_modes:
  - scalp
  - day
  - swing

market_structure:
  rolling_window_candles: 150

smc:
  fractal_left: 5
  fractal_right: 5

cache:
  ttl_seconds: 30

poll_interval_seconds: 90

telegram:
  enabled: true
  min_confidence_to_notify: 70

dashboard:
  admin_token_env: DASHBOARD_ADMIN_TOKEN
